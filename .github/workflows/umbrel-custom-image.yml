name: Build Umbrel custom image

on:
  push:
    branches:
      - umbrel-custom-2026.8.27
    paths:
      - .github/workflows/umbrel-custom-image.yml
      - Dockerfile.umbrel-custom
      - Dockerfile.umbrel-custom.dockerignore
      - umbrel-custom/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: umbrel-custom-2026.8.27
  cancel-in-progress: true

env:
  UPSTREAM_SHA: 5fc308a70719a83cccdbba4c0e39c23f5a8239d5
  IMAGE: ghcr.io/kitze/hermes-agent-umbrel
  TAG: v2026.8.27-custom1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out custom build files
        uses: actions/checkout@v4

      - name: Prepare exact upstream source and custom patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git /tmp/hermes-source
          git -C /tmp/hermes-source fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C /tmp/hermes-source checkout --detach "$UPSTREAM_SHA"
          git -C /tmp/hermes-source apply --check "$GITHUB_WORKSPACE/umbrel-custom/replied-voice-stt.patch"
          git -C /tmp/hermes-source apply "$GITHUB_WORKSPACE/umbrel-custom/replied-voice-stt.patch"
          cp "$GITHUB_WORKSPACE/Dockerfile.umbrel-custom" /tmp/hermes-source/Dockerfile.umbrel-custom
          cp "$GITHUB_WORKSPACE/Dockerfile.umbrel-custom.dockerignore" /tmp/hermes-source/Dockerfile.umbrel-custom.dockerignore

      - name: Use Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Build dashboard and TUI
        working-directory: /tmp/hermes-source
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --fetch-retries=5
          npm run build --workspace web
          npm run build --workspace ui-tui
          test -s hermes_cli/web_dist/index.html
          test -s ui-tui/dist/entry.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable amd64 image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/hermes-source
          file: /tmp/hermes-source/Dockerfile.umbrel-custom
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/kitze/hermes-agent
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=0.20.6
          provenance: false
